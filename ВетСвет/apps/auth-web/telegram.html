<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ВетСвет — вход через Telegram</title><style>:root{--ink:#0b1b1a;--mint:#c5f7da}*{box-sizing:border-box}body{min-height:100svh;margin:0;display:grid;place-items:center;padding:24px;color:white;background:radial-gradient(circle at 15% 10%,#317a77,transparent 28rem),linear-gradient(130deg,#04282b,#075055);font-family:Inter,system-ui,sans-serif}.card{width:min(100%,510px);padding:clamp(28px,7vw,58px);border:1px solid #ffffff3d;border-radius:30px;background:#ffffff17;box-shadow:0 35px 100px #0005;backdrop-filter:blur(22px)}.brand{margin:0 0 30px;color:var(--mint);font-size:.75rem;font-weight:850;letter-spacing:.16em;text-transform:uppercase}h1{margin:0;letter-spacing:-.08em;font-size:clamp(3rem,9vw,5.4rem);line-height:.84}p{margin:25px 0;color:#ffffffe0;line-height:1.5}.button{display:flex;align-items:center;justify-content:center;min-height:56px;border-radius:15px;color:var(--ink);background:var(--mint);font-weight:850;text-decoration:none}.status{min-height:22px;margin:17px 0 0;color:#ffffffb8;font-size:.83rem}.small{color:#ffffff8c;font-size:.75rem}</style></head><body><main class="card"><p class="brand">VetSvet · защищённый вход</p><h1>Откройте<br>свой мир<br>заботы.</h1><p>Подтвердите вход одним нажатием в Telegram. Пароль и SMS не нужны.</p><a class="button" id="open" href="#">Продолжить в Telegram ↗</a><p class="status" id="status">Создаём защищённую ссылку…</p><p class="small">Ссылка одноразовая и действует 10 минут. VetSvet не получает пароль от Telegram.</p></main><script>(async()=>{const status=document.querySelector('#status'),link=document.querySelector('#open');try{const r=await fetch('/api/auth/telegram/start',{method:'POST'}),d=await r.json();if(!r.ok)throw Error('Не удалось создать вход.');link.href=d.telegramUrl;status.textContent='Откройте бота, нажмите Start и вернитесь сюда.';const timer=setInterval(async()=>{const q=await fetch(`/api/auth/telegram/status?requestId=${encodeURIComponent(d.requestId)}`),s=await q.json();if(s.state==='AUTHENTICATED'){clearInterval(timer);location.assign(s.redirectTo)}else if(s.state==='EXPIRED'){clearInterval(timer);status.textContent='Ссылка истекла. Обновите страницу.'}},1800)}catch(e){status.textContent='Не удалось начать вход. Попробуйте обновить страницу.'}})();</script></body></html>
