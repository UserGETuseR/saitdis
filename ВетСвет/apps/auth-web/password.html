<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VetSvet — создайте пароль</title><style>:root{--mint:#c5f7da;--ink:#0b1b1a}*{box-sizing:border-box}body{min-height:100svh;margin:0;display:grid;place-items:center;padding:20px;color:#fff;background:radial-gradient(circle at 15% 10%,#317a77,transparent 28rem),linear-gradient(130deg,#04282b,#075055);font-family:Inter,system-ui,sans-serif}.card{width:min(100%,490px);padding:clamp(28px,7vw,54px);border:1px solid #ffffff3d;border-radius:29px;background:#ffffff17;box-shadow:0 35px 100px #0005;backdrop-filter:blur(22px)}.eyebrow{color:var(--mint);font-size:.72rem;font-weight:850;letter-spacing:.15em;text-transform:uppercase}h1{margin:15px 0;font-size:clamp(2.7rem,9vw,4.8rem);line-height:.86;letter-spacing:-.08em}p{line-height:1.5;color:#ffffffe0}form{display:grid;gap:12px;margin-top:24px}label{display:grid;gap:6px;font-size:.82rem;font-weight:750}input{min-height:50px;padding:0 14px;border:1px solid #ffffff48;border-radius:13px;outline:0;color:#fff;background:#052b2d80;font:1rem Inter,system-ui,sans-serif}input:focus{border-color:var(--mint)}button{min-height:54px;border:0;border-radius:14px;color:var(--ink);background:var(--mint);font:850 1rem Inter,system-ui,sans-serif;cursor:pointer}.note{min-height:22px;margin:15px 0 0;color:#ffd5ce;font-size:.84rem}</style></head><body><main class="card"><p class="eyebrow">VetSvet · завершение настройки</p><h1>Создайте<br>обычный вход.</h1><p>Telegram уже подтвердил, что это вы. Теперь придумайте логин и пароль — дальше будете входить без Telegram.</p><form id="form"><label>Логин<input id="login" autocomplete="username" minlength="3" maxlength="32" required></label><label>Пароль<input id="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label><button id="submit">Сохранить и открыть кабинет</button></form><p class="note" id="note"></p></main><script>document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const b=document.querySelector('#submit'),n=document.querySelector('#note');b.disabled=true;n.textContent='';try{const r=await fetch('/api/auth/password/set',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({login:document.querySelector('#login').value,password:document.querySelector('#password').value})}),d=await r.json();if(!r.ok)throw Error(d.message||'Не удалось сохранить пароль.');location.assign(d.redirectTo||'/staff/')}catch(error){n.textContent=error.message||'Не удалось сохранить пароль.'}finally{b.disabled=false}};</script></body></html>
