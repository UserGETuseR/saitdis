<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071d1c">
  <title>VetSvet Space — рабочее приложение</title>
  <link rel="stylesheet" href="/staff/staff-v3.css?v=20260811.2">
  <link rel="stylesheet" href="/staff/core-workspaces.css?v=20260817.1">
  <link rel="stylesheet" href="/staff/care-workspace.css?v=20260817.1">
  <link rel="stylesheet" href="/staff/grooming-revenue.css?v=20260817.1">
  <link rel="stylesheet" href="/staff/workspace-fixes.css?v=20260817.1">
</head>
<body>
  <div class="staff-app">
    <aside class="app-rail" id="app-rail" aria-label="Главная навигация">
      <div class="rail-brand"><a href="/" aria-label="VetSvet"><i>✦</i><span>ВЕТ СВЕТ</span></a><small>CARE OPERATING SYSTEM</small></div>
      <button class="command-trigger" id="command-open" type="button"><span>⌕</span><b>Найти или открыть</b><kbd>Ctrl K</kbd></button>
      <nav class="module-nav" id="module-nav"></nav>
      <div class="rail-profile"><span class="profile-orb">VS</span><div><b id="rail-role">Команда VetSvet</b><small>Главная клиника · online</small></div><a href="/api/v1/auth/sign-out" id="sign-out" aria-label="Выйти">↗</a></div>
    </aside>

    <header class="mobile-bar"><a class="mobile-brand" href="/"><i>✦</i> ВЕТ СВЕТ</a><button id="mobile-menu" type="button" aria-label="Открыть меню">☰</button></header>
    <div class="rail-scrim" id="rail-scrim"></div>

    <main class="app-stage">
      <section class="route-intro" id="route-intro" aria-live="polite"></section>
      <nav class="route-tabs" id="route-tabs" aria-label="Разделы страницы"></nav>
      <section class="workspace" aria-busy="true"><div class="app-loader"><i></i><b>Собираем рабочее пространство</b><span>Синхронизируем записи, пациентов и задачи</span></div></section>
    </main>

    <nav class="mobile-dock" id="mobile-dock" aria-label="Мобильная навигация"></nav>

    <dialog class="command-palette" id="command-palette">
      <form method="dialog" class="palette-shell">
        <div class="palette-search"><span>⌕</span><input id="command-input" autocomplete="off" placeholder="Пациент, владелец, модуль или действие…" aria-label="Глобальный поиск"><button value="cancel" aria-label="Закрыть">Esc</button></div>
        <div class="palette-results" id="command-results"></div>
        <footer><span>↑↓ выбрать</span><span>Enter открыть</span><span>Данные остаются внутри VetSvet</span></footer>
      </form>
    </dialog>
    <div class="toast-stack" id="toast-stack" aria-live="polite"></div>
  </div>
  <script src="/staff/staff-shell.js?v=20260811.2"></script>
  <script src="/staff/app.js?v=20260811.2"></script>
  <script src="/staff/core-workspaces.js?v=20260817.1"></script>
  <script src="/staff/care-workspace.js?v=20260817.1"></script>
</body>
</html>
