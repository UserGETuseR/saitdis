  <script>
    // Регистрация service worker (PWA: установка на телефон + офлайн).
    // Работает только по http(s)/localhost, не по file://
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      var reloadingForWorker = false;
      navigator.serviceWorker.addEventListener("controllerchange", function () {
        if (reloadingForWorker) return;
        reloadingForWorker = true;
        location.reload();
      });
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  </script>

  <script>
    (function () {
      var s = document.getElementById("splash");
      if (!s) return;
      var done = false, started = false;
      function start() {
        if (started) return; started = true;
        s.classList.add("in");
        setTimeout(hide, 1350);          // короткое узнаваемое вступление
      }
      function hide() {
        if (done) return; done = true;
        s.classList.add("hide");
        setTimeout(function () { if (s && s.parentNode) s.parentNode.removeChild(s); }, 520);
      }
      s.addEventListener("click", hide);
      // запуск только когда шрифты готовы — иначе текст «дёргается» при подмене шрифта
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function () { requestAnimationFrame(start); });
        setTimeout(start, 1200);         // подстраховка, если шрифты долго грузятся
      } else {
        requestAnimationFrame(function () { requestAnimationFrame(start); });
      }
    })();
  </script>
